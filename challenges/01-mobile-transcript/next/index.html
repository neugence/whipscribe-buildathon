<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transcript reader — next pass</title>
<meta name="description" content="Challenge 01: the WhipScribe transcript reader on a phone, next pass. Current design and proposed design side by side.">
<style>
:root{
  --ink:#16201a; --ink-2:#4b5a50; --ink-3:#7b887f; --line:#e4e9e3; --bg:#ffffff; --page:#f4f6f2;
  --brand:#3a6b3f; --brand-ink:#ffffff; --lime:#b8e62e; --lime-soft:#f1f9dc; --hl:#fff1a8;
  --warn:#9a3b12; --focus:#2f6fdb;
  --s1:#3a6b3f; --s2:#7a4bc2; --s3:#c0632a; --s4:#2c7fa3;
  --radius:14px; --dock:64px;
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}

/* ---------- gallery page ---------- */
.doc{max-width:1120px;margin:0 auto;padding:32px 16px 80px}
.doc h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.doc .lede{color:var(--ink-2);max-width:760px;margin:0 0 20px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px;padding:0;list-style:none}
.toc a{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.toc a:hover{border-color:var(--brand)}
section.case{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:0 0 28px}
section.case h2{font-size:22px;margin:0 0 4px}
section.case .sub{color:var(--ink-2);margin:0 0 20px;max-width:820px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px;align-items:start}
.col h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:600}
.col h3 .tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--lime-soft);color:var(--brand);letter-spacing:0;text-transform:none;font-size:12px}
.shot{display:block;width:100%;max-width:375px;border-radius:24px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.why{margin:18px 0 0;padding:0 0 0 18px;color:var(--ink-2)}
.why li{margin:0 0 6px}
.why b{color:var(--ink)}
.open{display:inline-block;margin-top:10px;font-size:14px;color:var(--brand)}
.kept{background:var(--lime-soft);border-radius:12px;padding:12px 16px;margin:18px 0 0;color:var(--ink-2);font-size:15px}
.phone-wrap{display:flex;flex-direction:column;align-items:flex-start}

/* ---------- phone frame ---------- */
.phone{position:relative;width:375px;height:740px;max-width:100%;background:var(--bg);border:1px solid #d6ddd5;border-radius:28px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.phone.w320{width:320px}
.phone.full{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none;max-width:none}

/* ---------- app ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:4px;padding:6px 6px 0 4px;min-height:56px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon-btn:hover{background:#f1f4f0}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{flex:1;min-width:0}
.title b{display:block;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;padding:6px 12px 8px;border-bottom:1px solid var(--line)}
.tab{flex:1;height:44px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px calc(var(--dock) + 24px)}
.turn{padding:12px 0;border-top:1px solid #f0f3ef}
.turn:first-child{border-top:0}
.turn.cont{border-top:0;padding-top:0;margin-top:-4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.who{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.who .name{font-weight:650}
.who .name.btn{text-decoration:underline dashed var(--ink-3);text-underline-offset:4px;min-height:44px;min-width:44px;margin:-12px 0;padding:0 2px;text-align:left}
.t{margin-left:auto;font-size:13px;color:var(--brand);font-variant-numeric:tabular-nums;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end;padding:0 8px;margin:-10px -8px -10px auto;border-radius:8px}
.t:hover{background:var(--lime-soft)}
.turn p{margin:0;font-size:var(--fs,17px);line-height:1.6;text-align:left;hyphens:manual}
.turn.now{background:linear-gradient(90deg,var(--lime-soft),transparent);margin:0 -16px;padding:12px 16px;border-left:3px solid var(--brand)}
.turn.hide-ts .t{display:none}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
mark.cur{outline:2px solid #e2b400}
.sel{background:#cfe0ff}
.endnote{margin:20px 0 0;padding:16px;border-radius:12px;background:var(--lime-soft);font-size:15px;color:var(--ink-2)}
.endnote b{color:var(--ink)}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;height:var(--dock);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px 0 10px}
.dock .bar{position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--line)}
.dock .bar i{display:block;height:100%;background:var(--brand)}
.play{width:44px;height:44px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:#fff}
.dock .time{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dock .grow{flex:1;min-width:0}
.dock .msg{font-size:13px;color:var(--ink-2);line-height:1.3}
.dock .msg b{color:var(--ink);display:block}
.speed{height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600}
.cta{height:44px;padding:0 14px;border-radius:12px;background:var(--lime);font-weight:700;font-size:14px;white-space:nowrap;color:#1c2a10}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(18,24,20,.36);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px 20px;transform:translateY(105%);transition:transform .22s ease;max-height:86%;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:#d5dbd4;margin:4px auto 10px}
.sheet h4{margin:4px 0 12px;font-size:18px}
.sheet .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{height:72px;border-radius:14px;background:#f4f7f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.quick svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;text-align:left;border-bottom:1px solid #f0f3ef;font-size:16px}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--ink-3);font-size:13px}
.row .end{margin-left:auto;color:var(--ink-3);font-size:14px}
.row.danger{color:#b3261e}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{height:44px;min-width:44px;padding:0 10px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.switch{margin-left:auto;width:52px;height:44px;position:relative;flex:none}
.switch::before{content:"";position:absolute;left:2px;right:2px;top:8px;height:28px;border-radius:999px;background:#cfd6ce}
.switch::after{content:"";position:absolute;top:11px;left:5px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked=true]::before{background:var(--brand)}
.switch[aria-checked=true]::after{left:25px}
.primary{width:100%;height:48px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;margin-top:8px}
.ghost{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);font-weight:600;margin-top:8px}
.note{font-size:13px;color:var(--ink-3);margin:10px 0 0}

/* search bar */
.searchbar{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;min-height:56px}
.searchbar input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font-size:16px;background:#f7f9f6}
.searchbar .count{font-size:13px;color:var(--ink-2);min-width:36px;text-align:center;font-variant-numeric:tabular-nums}

/* selection popover */
.pop{position:absolute;left:12px;right:12px;display:flex;background:var(--ink);color:#fff;border-radius:14px;padding:4px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:5}
.pop button{flex:1;min-height:48px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px}
.pop button:hover{background:rgba(255,255,255,.1)}
.pop svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;bottom:calc(var(--dock) + 12px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* processing */
.proc{padding:20px 16px 0}
.proc h5{font-size:20px;margin:0 0 4px}
.proc .eta{color:var(--ink-2);margin:0 0 16px}
.steps{list-style:none;margin:0 0 16px;padding:0}
.steps li{display:flex;align-items:center;gap:10px;min-height:36px;font-size:15px;color:var(--ink-3)}
.steps li.done{color:var(--ink)}
.steps li.doing{color:var(--ink);font-weight:600}
.steps i{width:20px;height:20px;border-radius:50%;border:2px solid #cfd6ce;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px}
.steps li.done i{background:var(--brand);border-color:var(--brand);color:#fff}
.steps li.doing i{border-color:var(--brand);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.doing i{animation:none}}
.pbar{height:6px;border-radius:6px;background:#e7ece6;overflow:hidden;margin:0 0 16px}
.pbar i{display:block;height:100%;background:var(--brand)}
.skel{height:14px;border-radius:7px;background:#eef2ed;margin:10px 0}
.leave{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink-2);margin:4px 0 16px}
.leave b{color:var(--ink)}

/* error */
.err{padding:48px 24px;text-align:center}
.err .ic{width:56px;height:56px;border-radius:16px;background:#fdf1ea;margin:0 auto 16px;display:grid;place-items:center}
.err .ic svg{width:28px;height:28px;stroke:var(--warn);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.err h5{font-size:20px;margin:0 0 8px}
.err p{color:var(--ink-2);margin:0 0 20px}
.err .code{font-size:13px;color:var(--ink-3);margin-top:16px}

/* mini mocks for issue before/after */
.mini{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;max-width:375px}
.mini .hdr{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.pill{margin-left:auto;padding:6px 12px;border-radius:999px;background:#eef3ec;font-size:14px;font-weight:600}
.pill.free{background:var(--lime);color:#1c2a10}
.opt{font-size:13px;color:var(--ink-2);background:#f6f8f5;border-radius:10px;padding:10px 12px;margin-top:12px}
.opt b{color:var(--brand)}
.upsell{border:1px solid #dfeec0;background:var(--lime-soft);border-radius:14px;padding:14px;margin-top:12px;font-size:14px}
.upsell b{display:block;font-size:15px}
.upsell .x{float:right;color:var(--ink-3)}
.bad{outline:2px dashed #d9534f;outline-offset:3px}
.caption{font-size:13px;color:var(--ink-3);margin:8px 0 0}

@media (max-width:420px){.doc{padding:20px 12px 60px} section.case{padding:16px} .phone,.phone.w320{width:100%}}
.col{min-width:0}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   Data: a four-person planning meeting (continues the text in the
   current screenshots, split into whole sentences per speaker).
   ============================================================ */
const SPEAKERS = [
  {id:0, name:'Priya',  role:'host',   color:'var(--s1)'},
  {id:1, name:'Marcus', role:'finance',color:'var(--s2)'},
  {id:2, name:'Lena',   role:'mobile', color:'var(--s3)'},
  {id:3, name:'Dev',    role:'design', color:'var(--s4)'}
];
const TURNS = [
  [0,0,  'Thanks everyone for joining the quarterly planning review. I want to move quickly today because we have a lot to cover and several people have a hard stop at the top of the hour.'],
  [1,9,  'First, the numbers. Revenue came in 11% above forecast. Most of that came from the enterprise segment, where three of the five deals we expected in the next quarter closed early.'],
  [1,20, 'The self-serve business was flat. Trials were up, but conversion to paid slipped by about a point and a half.'],
  [3,26, 'And we think that is mostly the onboarding change we shipped in July. People reach the upload screen without knowing their first transcript is free.'],
  [0,33, 'Can we get that fixed before the launch?'],
  [3,36, 'Yes. It is one line of copy in the header and one in the upload panel.'],
  [2,41, 'Second, the mobile launch. We are moving it from October to the first week of November. The accessibility audit found eleven issues, four of them blocking.'],
  [0,52, 'Which four?'],
  [2,54, 'Screen readers re-read the whole library during an upload, two buttons have no labels, and the player has no text alternative when audio is missing.'],
  [1,64, 'If the date moves, the marketing budget for October moves with it. I will send the new numbers on Friday.'],
  [0,72, 'Good. Last thing: Dev, the reader redesign.'],
  [3,76, 'The goal is fewer panels, not more. Speakers as names, one bar at the bottom, and a proper screen while the transcript is still processing.'],
  [0,88, 'Let us review it on Thursday. Thanks, everyone.']
];
const DURATION = 104;
const fmt = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ============================================================
   Icons
   ============================================================ */
const I = {
  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  playline:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  ask:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>'
};

/* ============================================================
   App: one reader, many states. opts:
   state: reader | processing | error
   width: 375 | 320 | 'full'
   preview: signed-out free preview (48%)
   audio: true | false
   sheet / search / select: which overlay is open on load
   ============================================================ */
function App(el, opts){
  const o = Object.assign({state:'reader', preview:false, audio:true, sheet:null, search:'', select:null, showTs:true, fs:17, now:3, playing:false, names:SPEAKERS.map(s=>s.name)}, opts);
  const phone = document.createElement('div');
  phone.className = 'phone' + (o.width===320?' w320':'') + (o.width==='full'?' full':'');
  el.appendChild(phone);
  let t = TURNS[o.now] ? TURNS[o.now][1] : 0, timer = null, toastT = null;

  const visibleTurns = () => o.preview ? TURNS.slice(0, 6) : TURNS;

  function header(){
    if (o.searchOpen) {
      const n = matches().length, i = n ? (o.hit % n) + 1 : 0;
      return `<div class="searchbar">
        <input aria-label="Search this transcript" placeholder="Search this transcript" value="${esc(o.search)}" data-q>
        <span class="count" aria-live="polite">${o.search ? (n? i+'/'+n : 'None') : ''}</span>
        <button class="icon-btn" aria-label="Previous match" data-prev>${I.up}</button>
        <button class="icon-btn" aria-label="Next match" data-next>${I.down}</button>
        <button class="icon-btn" aria-label="Close search" data-closesearch>${I.close}</button></div>`;
    }
    const meta = o.state==='processing' ? 'Transcribing · about 40 s left'
               : o.state==='error' ? 'Recording saved'
               : `${fmt(DURATION)} · ${SPEAKERS.length} speakers · EN${o.audio?'':' · no audio'}`;
    return `<div class="top">
      <button class="icon-btn" aria-label="Back to library">${I.back}</button>
      <div class="title"><b>Quarterly planning review</b><span>${meta}</span></div>
      ${o.state==='reader' ? `<button class="icon-btn" aria-label="Search this transcript" data-opensearch>${I.search}</button>` : ''}
      <button class="icon-btn" aria-label="More actions" data-sheet="more">${I.more}</button></div>`;
  }

  function tabs(){
    const dis = o.state!=='reader';
    return `<div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true">Transcript</button>
      <button class="tab" role="tab" aria-selected="false" ${dis?'disabled style="opacity:.45"':''}>Summary</button>
      <button class="tab" role="tab" aria-selected="false" ${dis?'disabled style="opacity:.45"':''}>Chat</button></div>`;
  }

  function matches(){
    if (!o.search) return [];
    const q = o.search.toLowerCase(), out = [];
    visibleTurns().forEach((tu, i) => { let at = tu[2].toLowerCase().indexOf(q); while (at >= 0) { out.push([i, at]); at = tu[2].toLowerCase().indexOf(q, at + q.length); } });
    return out;
  }

  function turnHTML(tu, i, list){
    const sp = SPEAKERS[tu[0]], name = o.state==='processing' ? 'Speaker '+(tu[0]+1) : o.names[tu[0]];
    const cont = list && i>0 && list[i-1][0]===tu[0];
    let text = esc(tu[2]);
    if (o.search) {
      const m = matches(), cur = m.length ? m[o.hit % m.length] : null, q = o.search;
      const parts = []; let last = 0, raw = tu[2], lq = q.toLowerCase(), at = raw.toLowerCase().indexOf(lq);
      while (at >= 0) { parts.push(esc(raw.slice(last, at))); const isCur = cur && cur[0]===i && cur[1]===at; parts.push(`<mark class="${isCur?'cur':''}" ${isCur?'data-cur':''}>${esc(raw.slice(at, at+q.length))}</mark>`); last = at + q.length; at = raw.toLowerCase().indexOf(lq, last); }
      parts.push(esc(raw.slice(last))); text = parts.join('');
    }
    if (o.select===i) text = `<span class="sel">${text}</span>`;
    const now = o.audio && playingIndex()===i;
    return `<div class="turn${now?' now':''}${cont?' cont':''}${o.showTs?'':' hide-ts'}" data-i="${i}">
      <div class="who">${cont ? `<span class="sr">${esc(name)} continues</span>` : `<span class="dot" style="background:${sp.color}" aria-hidden="true"></span>
        ${o.state==='processing' ? `<span class="name">${esc(name)}</span>` : `<button class="name btn" data-rename="${tu[0]}" aria-label="Speaker ${tu[0]+1}: ${esc(name)}. Rename">${esc(name)}</button>`}`}
        ${o.audio ? `<button class="t" data-seek="${tu[1]}" aria-label="Play from ${fmt(tu[1])}">${fmt(tu[1])}</button>` : `<span class="t" style="color:var(--ink-3)">${fmt(tu[1])}</span>`}</div>
      <p data-text="${i}">${text}</p></div>`;
  }

  function playingIndex(){ let k = 0; TURNS.forEach((tu, i) => { if (tu[1] <= t) k = i; }); return k; }

  function body(){
    if (o.state==='processing') {
      return `<div class="scroll" style="padding:0"><div class="proc">
        <h5>Almost ready</h5><p class="eta">Your transcript appears here as it's written. About 40 seconds left.</p>
        <div class="pbar" role="progressbar" aria-label="Transcribing" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><i style="width:62%"></i></div>
        <ol class="steps">
          <li class="done"><i>✓</i>Uploaded · 1:44 of audio</li>
          <li class="doing"><i></i>Writing the transcript · 62%</li>
          <li><i></i>Naming speakers</li>
          <li><i></i>Summary and key quotes</li></ol>
        <div class="leave"><b>You can close this page.</b> We'll email you when it's done, and it stays in your library.</div>
        <div class="lbl" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 4px">Ready so far</div>
        </div><div style="padding:0 16px">
        ${TURNS.slice(0,3).map((tu,i,a)=>turnHTML(tu,i,a)).join('')}
        <div class="turn" aria-hidden="true"><div class="skel" style="width:30%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div>
        </div></div>`;
    }
    if (o.state==='error') {
      return `<div class="scroll"><div class="err">
        <div class="ic">${I.warn}</div>
        <h5>We couldn't open this transcript</h5>
        <p>Your recording is safe. The problem is on our side; try again in a moment.</p>
        <button class="primary" data-retry>Try again</button>
        <button class="ghost">Back to library</button>
        <div class="code">Error 503 · <button style="text-decoration:underline;min-height:44px" data-copyerr>copy details for support</button></div></div></div>`;
    }
    const list = visibleTurns().map((tu,i,a)=>turnHTML(tu,i,a)).join('');
    const end = o.preview
      ? `<div class="endnote"><b>That's the free preview, about half.</b> Create a free account to read the rest, download it, and keep it in your library. No card needed.</div>`
      : '';
    const noaudio = !o.audio ? `<div class="endnote" style="margin:4px 0 8px"><b>Audio isn't available for this file.</b> The transcript is complete; timestamps are shown for reference.</div>` : '';
    return `<div class="scroll" data-scroll>${noaudio}${list}${end}</div>`;
  }

  function dock(){
    if (o.state!=='reader' || o.searchOpen || o.sheet==='rename') return '';
    const pct = Math.round(t / DURATION * 100);
    if (o.preview) {
      return `<div class="dock"><span class="bar"><i style="width:${o.audio?pct:48}%"></i></span>
        ${o.audio ? `<button class="play" aria-label="${o.playing?'Pause':'Play'}" data-play>${o.playing?I.pause:I.play}</button>` : ''}
        <div class="grow msg"><b>Free preview · 48%</b>No account yet</div>
        <button class="cta">Keep reading</button></div>`;
    }
    if (!o.audio) return '';
    return `<div class="dock"><span class="bar"><i style="width:${pct}%"></i></span>
      <button class="play" aria-label="${o.playing?'Pause':'Play'}" data-play>${o.playing?I.pause:I.play}</button>
      <div class="grow time">${fmt(t)} / ${fmt(DURATION)}</div>
      <button class="speed" aria-label="Playback speed">1×</button></div>`;
  }

  function sheet(){
    const s = o.sheet;
    let inner = '';
    if (s==='more') inner = `<h4>Quarterly planning review</h4>
      <div class="quick">
        <button data-act="copy">${I.copy}Copy text</button>
        <button data-sheet="download">${I.dl}Download</button>
        <button data-act="link">${I.share}Share link</button></div>
      <div class="lbl">Reading</div>
      <div class="row">Timestamps<button class="switch" role="switch" aria-checked="${o.showTs}" aria-label="Show timestamps" data-ts></button></div>
      <div class="row">Text size<div class="seg" role="group" aria-label="Text size">
        ${[['S',15],['M',17],['L',20]].map(([k,v])=>`<button aria-pressed="${o.fs===v}" data-fs="${v}">${k}</button>`).join('')}</div></div>
      <div class="lbl">This recording</div>
      <button class="row" data-act="rename">Rename</button>
      <button class="row">Quiz me on this<span class="end">Study mode</span></button>
      <button class="row">Details<span class="end">1:44 · m4a · 2 MB</span></button>
      <button class="row danger">Delete recording…</button>`;
    if (s==='download') inner = `<h4>Download</h4>
      <button class="row" data-act="dl-txt"><span>Text (.txt)<small>Speaker names and times included</small></span><span class="end">${'↓'}</span></button>
      <button class="row" data-act="dl-docx"><span>Word (.docx)<small>For editing and sharing</small></span><span class="end">↓</span></button>
      <button class="row"><span>Subtitles (.srt, .vtt)<small>For video players</small></span><span class="end">›</span></button>
      <button class="row"><span>Translated subtitles<small>Pick one of 100+ languages</small></span><span class="end">›</span></button>
      <button class="row"><span>Save to Google Drive</span><span class="end">›</span></button>
      <p class="note">Summary exports live on the Summary tab, next to the summary.</p>`;
    if (s==='rename') inner = `<h4>Rename speaker</h4>
      <p class="note" style="margin:0 0 12px">Applies to all ${TURNS.filter(tu=>tu[0]===o.renameId).length} turns by this speaker.</p>
      <input data-newname value="${esc(o.names[o.renameId])}" aria-label="Speaker name" style="width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px">
      <button class="primary" data-saverename>Save</button>`;
    return `<div class="scrim${s?' on':''}" data-closesheet></div>
      <div class="sheet${s?' on':''}" role="dialog" aria-modal="true" aria-label="${s||''}" ${s?'':'aria-hidden="true"'}><div class="grab"></div>${inner}</div>`;
  }

  function pop(){
    if (o.select==null) return '';
    const tu = TURNS[o.select];
    return `<div class="pop" style="top:${o.popTop||200}px" role="menu" aria-label="Selected text">
      <button role="menuitem" data-act="copyq">${I.copy}Copy</button>
      ${o.audio?`<button role="menuitem" data-seek="${tu[1]}">${I.playline}Play</button>`:''}
      <button role="menuitem" data-act="quote">${I.share}Share quote</button>
      <button role="menuitem" data-act="ask">${I.ask}Ask about this</button></div>`;
  }

  function render(keepScroll){
    const sc = phone.querySelector('[data-scroll]'); const top = sc ? sc.scrollTop : 0;
    phone.innerHTML = `<div class="app" style="--fs:${o.fs}px">${header()}${tabs()}${body()}${dock()}${pop()}${sheet()}<div class="toast" role="status" aria-live="polite"></div></div>`;
    const sc2 = phone.querySelector('[data-scroll]');
    if (sc2 && keepScroll) sc2.scrollTop = top;
    const cur = phone.querySelector('[data-cur]');
    if (cur && sc2 && o.jump) { const tr = cur.closest('.turn'); sc2.scrollTop += tr.getBoundingClientRect().top - sc2.getBoundingClientRect().top - 8; o.jump = false; }
    if (o.select!=null && o.placePop) { const p = phone.querySelector(`[data-text="${o.select}"]`); if (p && sc2) { sc2.scrollTop += p.getBoundingClientRect().top - sc2.getBoundingClientRect().top - 40; const pr = phone.getBoundingClientRect(); o.popTop = p.getBoundingClientRect().bottom - pr.top + 8; o.placePop = false; render(true); } }
  }

  function toast(msg){ const tt = phone.querySelector('.toast'); tt.textContent = msg; tt.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>tt.classList.remove('on'), 1600); }

  function tick(){ t += 1; if (t >= DURATION) { t = DURATION; o.playing = false; clearInterval(timer); } render(true); }

  phone.addEventListener('click', e => {
    const b = e.target.closest('button,[data-closesheet],p[data-text]'); if (!b) return;
    const d = b.dataset;
    if (d.play!==undefined){ o.playing = !o.playing; clearInterval(timer); if (o.playing) timer = setInterval(tick, 1000); render(true); return; }
    if (d.seek){ t = +d.seek; o.select = null; if (!o.playing){ o.playing = true; clearInterval(timer); timer = setInterval(tick, 1000);} render(true); return; }
    if (d.sheet){ o.sheet = d.sheet; o.select = null; render(true); return; }
    if (d.closesheet!==undefined){ o.sheet = null; render(true); return; }
    if (d.opensearch!==undefined){ o.searchOpen = true; o.hit = 0; render(true); phone.querySelector('[data-q]').focus(); return; }
    if (d.closesearch!==undefined){ o.searchOpen = false; o.search = ''; render(true); return; }
    if (d.next!==undefined){ o.hit = (o.hit||0) + 1; o.jump = true; render(true); return; }
    if (d.prev!==undefined){ const n = matches().length || 1; o.hit = ((o.hit||0) - 1 + n) % n; o.jump = true; render(true); return; }
    if (d.ts!==undefined){ o.showTs = !o.showTs; render(true); return; }
    if (d.fs){ o.fs = +d.fs; render(true); return; }
    if (d.rename){ o.renameId = +d.rename; o.sheet = 'rename'; render(true); setTimeout(()=>phone.querySelector('[data-newname]')?.select(), 250); return; }
    if (d.saverename!==undefined){ const v = phone.querySelector('[data-newname]').value.trim(); if (v) o.names[o.renameId] = v; o.sheet = null; render(true); toast('Renamed everywhere in this transcript'); return; }
    if (d.retry!==undefined){ o.state = 'reader'; render(); return; }
    if (d.copyerr!==undefined){ toast('Details copied'); return; }
    if (d.text){ const i = +d.text; o.select = o.select===i ? null : i; const r = b.getBoundingClientRect(), pr = phone.getBoundingClientRect(); o.popTop = Math.min(pr.height - 150, Math.max(64, r.bottom - pr.top + 8)); render(true); return; }
    const act = d.act;
    const msgs = {copy:'Transcript copied', link:'Link copied', 'dl-txt':'Downloading .txt', 'dl-docx':'Downloading .docx', copyq:'Quote copied', quote:'Link to 0:'+String(TURNS[o.select??0][1]).padStart(2,'0')+' copied', ask:'Opens Chat with this quote attached', rename:'Tap any speaker name to rename'};
    if (act){ if (act==='rename'){ o.sheet = null; } if (act==='copyq'||act==='quote'||act==='ask') o.select = null; if (act.startsWith('dl')) o.sheet = null; render(true); toast(msgs[act]); }
  });
  phone.addEventListener('input', e => { if (e.target.matches('[data-q]')) { o.search = e.target.value; o.hit = 0; o.jump = true; const pos = e.target.selectionStart; render(); const q = phone.querySelector('[data-q]'); q.focus(); q.setSelectionRange(pos, pos); } });
  phone.addEventListener('keydown', e => { if (e.key==='Escape'){ if (o.sheet){ o.sheet=null; render(true);} else if (o.searchOpen){ o.searchOpen=false; o.search=''; render(true);} } if (e.key==='Enter' && e.target.matches('[data-q]')){ o.hit=(o.hit||0)+1; o.jump = true; render(true); phone.querySelector('[data-q]').focus(); } });

  if (o.search) o.searchOpen = true, o.hit = o.hit || 0, o.jump = true;
  if (o.select!=null) o.placePop = true;
  render();
  return phone;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderDoc(){
  const root = document.getElementById('root');
  root.innerHTML = `<div class="doc">
    <h1>The transcript reader on a phone — next pass</h1>
    <p class="lede">Current design on the left (the screenshots from <code>after/</code>), my proposal on the right. The right-hand phones are live: tap play, the speaker names, the ⋯ menu, a line of text, search. Every case also opens full-screen so you can try it on a real phone. By Achi Vyshnavi.</p>
    <ul class="toc">${CASES.map(c=>`<li><a href="#${c.id}">${c.title.replace(/^\S+ · /,'')}</a></li>`).join('')}<li><a href="#issues">From my bug reports</a></li></ul>
    ${CASES.map(c=>`<section class="case" id="${c.id}">
      <h2>${c.title}</h2><p class="sub">${c.sub}</p>
      <div class="pair">
        <div class="col"><h3>Current</h3>${c.cur ? `<img class="shot" src="../after/${c.cur}" alt="Current design: ${esc(c.title)}" loading="lazy" ${c.w?`style="max-width:${c.w}px"`:''}>` : `<div class="mini" style="color:var(--ink-3)">No screen exists for this state today.</div>`}
          ${c.extraCur?`<img class="shot" style="margin-top:12px" src="../after/${c.extraCur}" alt="Current download sheet" loading="lazy">`:''}</div>
        <div class="col phone-wrap"><h3>Next <span class="tag">live</span></h3><div data-app="${c.id}"></div>
          <a class="open" href="?screen=${c.id}">Open full-screen on your phone →</a></div>
      </div>
      <ul class="why">${c.why.map(w=>`<li>${w}</li>`).join('')}</ul>
    </section>`).join('')}
    ${issuesSection()}
    <section class="case"><h2>What I kept, and why</h2>
      <ul class="why">
        <li><b>The three tabs</b> (Transcript, Summary, Chat). They map to the three jobs people come with: read it, get the gist, ask it something.</li>
        <li><b>A bottom sheet as the one pattern for panels</b>. It was already used for Download and More; I made everything use it.</li>

}
