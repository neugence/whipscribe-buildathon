name: Publish lesson-review image

on:
  push:
    tags:
      - "lesson-review-v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: lesson-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5

      - name: Use the supported Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Test the lesson reviewer
        working-directory: apps/raagan/twelvestrings_transcript
        run: npm test

      - name: Read and validate the release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#lesson-review-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as lesson-review-v0.1.0" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the release image
        uses: docker/build-push-action@v7
        with:
          context: apps/raagan/twelvestrings_transcript
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/twelvestrings-lesson-review:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/twelvestrings-lesson-review:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
