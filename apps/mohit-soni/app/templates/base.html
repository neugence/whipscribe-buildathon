<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support QA Copilot</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18212f;
        --muted: #667085;
        --line: #d8dee8;
        --paper: #fbfaf7;
        --panel: #ffffff;
        --accent: #0f6b5f;
        --accent-strong: #0a4c44;
        --warn: #9a3412;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(24, 33, 47, 0.045) 1px, transparent 1px),
          linear-gradient(180deg, rgba(24, 33, 47, 0.04) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
        font-family: "Aptos", "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1040px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .shell {
        display: grid;
        gap: 18px;
      }

      .masthead {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 14px;
      }

      h1, h2, h3, p { margin-top: 0; }
      h1 { font-size: clamp(2rem, 6vw, 4.2rem); line-height: 0.95; margin-bottom: 8px; max-width: 760px; }
      h2 { font-size: 1.15rem; margin-bottom: 8px; }
      h3 { font-size: 1rem; margin-bottom: 6px; }

      .eyebrow {
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 22px;
        box-shadow: 0 18px 50px rgba(17, 24, 39, 0.08);
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 0.42fr);
        gap: 18px;
        align-items: start;
      }

      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .demo-actions { display: grid; gap: 12px; align-items: start; }
      .muted { color: var(--muted); }
      .status { font-weight: 800; }
      .metric { font-size: 2.4rem; line-height: 1; font-weight: 900; }

      label { display: block; font-weight: 800; margin-bottom: 8px; }
      input, select, button, .button {
        min-height: 44px;
        font: inherit;
        border-radius: 6px;
      }
      input, select {
        width: 100%;
        border: 1px solid var(--line);
        padding: 10px 12px;
        background: white;
      }
      button, .button {
        border: 0;
        background: var(--accent);
        color: white;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        padding: 10px 14px;
        text-decoration: none;
      }
      button:hover, .button:hover { background: var(--accent-strong); }

      .item { border-top: 1px solid var(--line); padding: 16px 0; }
      .evidence {
        background: #eef6f3;
        border-left: 4px solid var(--accent);
        border-radius: 6px;
        padding: 10px 12px;
        margin-top: 8px;
      }
      .pain-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .pain-list li {
        background: #fff7ed;
        border-left: 4px solid var(--warn);
        border-radius: 6px;
        padding: 10px 12px;
      }
      .warning { color: var(--warn); font-weight: 800; }

      @media (max-width: 760px) {
        .masthead { display: block; }
        .grid { grid-template-columns: 1fr; }
        .panel { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>
